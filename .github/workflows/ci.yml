name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anchor
          POSTGRES_PASSWORD: anchor
          POSTGRES_DB: anchor
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U anchor"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      ANCHOR_DSN: postgresql://anchor:anchor@localhost:55432/anchor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Chaos campaign
        # Smaller than the documented 100/60 run so CI stays under a few minutes. The
        # invariants asserted are identical; only the sample size differs.
        run: python -m chaos.harness --runs 30 --kills 20 --max-seconds 180 --json chaos-report.json

      - name: Upload chaos report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-report
          path: chaos-report.json
