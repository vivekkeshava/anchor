[project]
name = "anchor"
version = "0.1.0"
description = "Durable execution runtime for LLM agents: journal, deterministic replay, effectively-once tool side effects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vivek Keshava" }]
dependencies = [
    "asyncpg>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
]

[project.scripts]
anchor-worker = "anchor.worker:main"
anchor-chaos = "chaos.harness:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# examples and chaos must be installed too: tests import the demo agent, and the
# anchor-chaos console script points into chaos.harness. Leaving them out works when
# pytest is invoked as `python -m pytest` (which puts CWD on sys.path) and fails on a
# clean `pip install -e .` followed by bare `pytest` — i.e. it passes locally and breaks
# in CI.
packages = [
    "anchor",
    "anchor.journal",
    "anchor.runtime",
    "anchor.effects",
    "anchor.leases",
    "examples",
    "chaos",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
